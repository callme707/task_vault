<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快速记录</title>
  <link rel="stylesheet" href="quick.css" />
</head>
<body>
  <div class="quick-card">
    <div class="hint" data-tauri-drag-region title="按住可拖动窗口">快速记录 · 可 <kbd>Ctrl+V</kbd> 粘贴截图 · <kbd>Enter</kbd> 保存 · <kbd>Shift+Enter</kbd> 换行 · <kbd>Esc</kbd> 隐藏</div>
    <textarea id="task-input" placeholder="记下任务 / 需求 / 想法，或粘贴截图让 AI 提取待办…"></textarea>
    <div id="img-preview" class="img-preview hidden">
      <img id="img-thumb" alt="待解析截图" />
      <button id="btn-remove-img" title="移除图片">×</button>
      <span class="img-tip">截图将交给 AI 提取待办</span>
    </div>
    <div class="actions">
      <span id="status"></span>
      <button id="btn-save" class="btn primary">保存 (Enter)</button>
      <button id="btn-cancel" class="btn">隐藏 (Esc)</button>
    </div>
  </div>
  <script src="quick.js"></script>
</body>
</html>
