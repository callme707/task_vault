<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskVault · 快速记录</title>
  <link rel="stylesheet" href="quick.css" />
</head>
<body>
  <main class="quick-card" aria-label="快速记录">
    <div class="quick-head" data-tauri-drag-region title="按住可拖动窗口">
      <div class="quick-brand"><span class="quick-mark" aria-hidden="true">TV</span><span>快速记录</span></div>
      <div class="quick-hint"><span>保存后进入记录区</span><span><kbd>Enter</kbd> 保存</span><span><kbd>Shift + Enter</kbd> 换行</span><span><kbd>Esc</kbd> 隐藏</span></div>
    </div>
    <label class="sr-only" for="task-input">记录内容</label>
    <textarea id="task-input" placeholder="记下任务、需求或想法，也可以粘贴截图…" aria-describedby="input-help"></textarea>
    <div id="input-help" class="input-help">截图会交给已选择的 AI 服务提取待办，原始记录会保留在记录区。</div>
    <div id="img-preview" class="img-preview hidden">
      <img id="img-thumb" alt="待解析截图" />
      <button id="btn-remove-img" type="button" title="移除图片">移除</button>
      <span class="img-tip">已附加图片 · 保存后解析</span>
    </div>
    <div class="actions">
      <span id="status" role="status" aria-live="polite"></span>
      <button id="btn-cancel" class="btn" type="button">隐藏</button>
      <button id="btn-save" class="btn primary" type="button">保存记录</button>
    </div>
  </main>
  <script src="quick.js"></script>
</body>
</html>
