<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskVault · 快速记录</title>
  <link rel="stylesheet" href="quick.css" />
</head>
<body>
  <div id="quick-stage" class="quick-stage">
    <main class="quick-card" aria-label="快速记录">
      <div class="quick-light-beam" aria-hidden="true"></div>
      <div class="quick-glow" aria-hidden="true"></div>

      <div class="quick-head" data-tauri-drag-region title="按住可拖动窗口">
        <div class="quick-brand">
          <span class="quick-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
              <path d="M12 2.5C12.7 7.1 16.9 11.3 21.5 12C16.9 12.7 12.7 16.9 12 21.5C11.3 16.9 7.1 12.7 2.5 12C7.1 11.3 11.3 7.1 12 2.5Z" />
            </svg>
          </span>
          <div class="quick-title-group">
            <span class="quick-title">快速记录</span>
            <span class="quick-sub">AI 草稿提炼</span>
          </div>
        </div>
        <div class="quick-hint">
          <span><kbd>Enter</kbd> 保存</span>
          <span><kbd>Shift+Enter</kbd> 换行</span>
          <span><kbd>Esc</kbd> 隐藏</span>
        </div>
      </div>

      <label class="sr-only" for="task-input">记录内容</label>
      <textarea id="task-input" placeholder="记下待办、需求或闪念，或直接 Ctrl+V 粘贴截图 / 拖入图片…" aria-describedby="input-help"></textarea>

      <div id="img-preview" class="img-preview hidden">
        <img id="img-thumb" alt="待解析截图" />
        <div class="img-meta">
          <span class="img-tip">🖼️ 已附加截图 · 保存后自动提取待办</span>
          <button id="btn-remove-img" type="button" title="移除图片">移除附图</button>
        </div>
      </div>

      <div class="actions">
        <div class="footer-left">
          <div id="input-help" class="input-help">
            <svg class="lock-icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span>原始记录保留在收集箱，不会被修改</span>
          </div>
          <span id="status" role="status" aria-live="polite"></span>
        </div>
        <div class="action-buttons">
          <div id="quick-persona-wrap" class="quick-persona-wrap">
            <select id="quick-persona" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="">🤖 默认视角</option>
              <option value="auto">🤖 智能自适应</option>
              <option value="dev">💻 研发专家</option>
              <option value="pm">📋 产品项目</option>
              <option value="gtd">🎯 GTD 行动</option>
            </select>
            <button id="quick-persona-btn" class="quick-persona-btn" type="button" aria-haspopup="listbox" aria-expanded="false" title="按需指定本条记录的 AI 专家拆解视角">
              <span id="quick-persona-label">🤖 默认视角</span>
              <span class="quick-persona-caret" aria-hidden="true">▾</span>
            </button>
            <div id="quick-persona-menu" class="quick-persona-menu hidden" role="listbox" aria-label="解析专家身份">
              <button type="button" class="quick-persona-opt active" role="option" aria-selected="true" data-value="">🤖 默认视角</button>
              <button type="button" class="quick-persona-opt" role="option" aria-selected="false" data-value="auto">🤖 智能自适应</button>
              <button type="button" class="quick-persona-opt" role="option" aria-selected="false" data-value="dev">💻 研发专家</button>
              <button type="button" class="quick-persona-opt" role="option" aria-selected="false" data-value="pm">📋 产品项目</button>
              <button type="button" class="quick-persona-opt" role="option" aria-selected="false" data-value="gtd">🎯 GTD 行动</button>
            </div>
          </div>
          <button id="btn-cancel" class="btn" type="button">隐藏</button>
          <button id="btn-save" class="btn primary" type="button">保存记录</button>
        </div>
      </div>
    </main>
  </div>
  <script src="quick.js"></script>
</body>
</html>
